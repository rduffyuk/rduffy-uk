<h2>What should the hover tooltip show?</h2>
<p class="subtitle">When someone hovers over a day cell on the heatmap</p>

<div class="options">
  <div class="option" data-choice="simple" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Simple — count + date</h3>
      <p><code style="background:#1e293b;padding:2px 8px;border-radius:4px;color:#e2e8f0;">12 commits on May 27, 2026</code></p>
    </div>
  </div>
  <div class="option" data-choice="platform" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Platform split — show both sources</h3>
      <p><code style="background:#1e293b;padding:2px 8px;border-radius:4px;color:#e2e8f0;">May 27: 37 GitLab · 5 GitHub</code></p>
    </div>
  </div>
  <div class="option" data-choice="none" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>No tooltip — just the visual</h3>
      <p>Clean and minimal. The graph speaks for itself.</p>
    </div>
  </div>
</div>
