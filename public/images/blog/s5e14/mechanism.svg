<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" role="img" aria-label="A successful Job updates CronJob success only through its controller ownership; an unowned manual probe leaves parent status unchanged."><defs><pattern id="grid-e14d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b3f4a"/></pattern><marker id="arrow-e14d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a78bfa"/></marker></defs><rect width="100%" height="100%" fill="#141414"/><rect width="100%" height="100%" fill="url(#grid-e14d)"/><path data-flow-edge class="flow-motion" d="M85 46H225" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" fill="none" marker-end="url(#arrow-e14d)"/><path data-flow-edge class="flow-motion" d="M275 46H415" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" fill="none" marker-end="url(#arrow-e14d)"/><path data-flow-edge class="flow-motion" d="M465 46H625" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" fill="none" marker-end="url(#arrow-e14d)"/><path data-flow-edge class="flow-motion" d="M275 46H330V195H275" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" fill="none" marker-end="url(#arrow-e14d)"/><text x="345" y="28" text-anchor="middle" fill="#c4b5fd" font-size="11" font-family="system-ui">owned</text><text x="345" y="160" fill="#c4b5fd" font-size="11" font-family="system-ui">unowned</text><g transform="translate(60 46)"><circle r="25" fill="#1c1e24" stroke="#555867"/><g fill="none" stroke="#e9eaee" stroke-width="1.5"><rect x="-12" y="-13" width="24" height="26" rx="3"/><path d="M-7 0L-1 6L9-6"/></g></g><text x="60" y="94" text-anchor="middle" font-size="12.5" font-family="system-ui" fill="#e9eaee">Job completes</text><text x="60" y="114" text-anchor="middle" font-size="10.5" font-family="system-ui" fill="#aab0bc">Application result</text><g transform="translate(250 46)"><circle r="25" fill="#1c1e24" stroke="#555867"/><g fill="none" stroke="#e9eaee" stroke-width="1.5"><path d="M-2-8L2-12A7 7 0 0 1 12-2L8 2M2 8L-2 12A7 7 0 0 1-12 2L-8-2M-6 6L6-6"/></g></g><text x="250" y="94" text-anchor="middle" font-size="12.5" font-family="system-ui" fill="#e9eaee">Owner check</text><text x="250" y="114" text-anchor="middle" font-size="10.5" font-family="system-ui" fill="#aab0bc">Controller reference?</text><g transform="translate(440 46)"><circle r="25" fill="#1c1e24" stroke="#555867"/><g fill="none" stroke="#e9eaee" stroke-width="1.5"><rect x="-13" y="-11" width="26" height="23" rx="2"/><path d="M-13-4H13M-7-15V-8M7-15V-8M-7 4L-2 9L8-1"/></g></g><text x="440" y="94" text-anchor="middle" font-size="12.5" font-family="system-ui" fill="#e9eaee">CronJob status</text><text x="440" y="114" text-anchor="middle" font-size="10.5" font-family="system-ui" fill="#aab0bc">Owned success recorded</text><g transform="translate(650 46)"><circle r="25" fill="#1c1e24" stroke="#555867"/><g fill="none" stroke="#e9eaee" stroke-width="1.5"><path d="M-10 7H10L7 1V-5A7 7 0 0 0-7-5V1ZM-3 12H3"/></g></g><text x="650" y="94" text-anchor="middle" font-size="12.5" font-family="system-ui" fill="#e9eaee">Alert reads status</text><text x="650" y="114" text-anchor="middle" font-size="10.5" font-family="system-ui" fill="#aab0bc">Schedule minus success</text><g transform="translate(250 195)"><circle r="25" fill="#1c1e24" stroke="#555867"/><g fill="none" stroke="#e9eaee" stroke-width="1.5"><circle r="10" cx="-2" cy="-2"/><path d="M5 5L13 13M-7-2H3"/></g></g><text x="250" y="243" text-anchor="middle" font-size="12.5" font-family="system-ui" fill="#e9eaee">Manual probe</text><text x="250" y="263" text-anchor="middle" font-size="10.5" font-family="system-ui" fill="#aab0bc">Parent stays unchanged</text><text x="370" y="184" fill="#e9eaee" font-size="13" font-family="system-ui">Manual success can prove an application path.</text><text x="370" y="206" fill="#aab0bc" font-size="12" font-family="system-ui">It does not advance an unrelated parent record.</text></svg>