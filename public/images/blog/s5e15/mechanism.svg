<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="A pending document is processed. Success saves its content marker; failure leaves it pending. The Job exits unsuccessfully if any record failed."><defs><pattern id="grid-e15d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b3f4a"/></pattern><marker id="arrow-e15d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a78bfa"/></marker></defs><rect width="100%" height="100%" fill="#141414"/><rect width="100%" height="100%" fill="url(#grid-e15d)"/><path class="flow-motion" data-flow-edge d="M85 155H225" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15d)" fill="none"/><path class="flow-motion" data-flow-edge d="M275 155H350V65H445" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15d)" fill="none"/><path class="flow-motion" data-flow-edge d="M275 155H350V250H445" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15d)" fill="none"/><path class="flow-motion" data-flow-edge d="M495 65H590V155H655" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15d)" fill="none"/><path class="flow-motion" data-flow-edge d="M495 250H590V155H655" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15d)" fill="none"/><g transform="translate(60 155)"><circle r="25" fill="#1c1e24" stroke="#555867"/><g fill="none" stroke="#e9eaee" stroke-width="1.5"><rect x="-10" y="-13" width="20" height="26" rx="2"/><path d="M-5-5H5M-5 0H5M-5 5H2"/></g></g><text x="60" y="202" text-anchor="middle" fill="#e9eaee" font-family="system-ui" font-size="12.5">Pending record</text><text x="60" y="222" text-anchor="middle" fill="#aab0bc" font-family="system-ui" font-size="10.5">Current version</text><g transform="translate(250 155)"><circle r="25" fil