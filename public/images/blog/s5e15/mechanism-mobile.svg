<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 560" role="img" aria-label="A pending document is processed. Success saves its content marker; failure leaves it pending. The Job exits unsuccessfully if any record failed."><defs><pattern id="grid-e15m" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b3f4a"/></pattern><marker id="arrow-e15m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#a78bfa"/></marker></defs><rect width="100%" height="100%" fill="#141414"/><rect width="100%" height="100%" fill="url(#grid-e15m)"/><path class="flow-motion" data-flow-edge d="M44 65V135" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15m)" fill="none"/><path class="flow-motion" data-flow-edge d="M44 185V275" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15m)" fill="none"/><path class="flow-motion" data-flow-edge d="M69 160H80V225H230V275" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15m)" fill="none"/><path class="flow-motion" data-flow-edge d="M44 325V475" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15m)" fill="none"/><path class="flow-motion" data-flow-edge d="M255 300H310V420H44V475" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3 7" marker-end="url(#arrow-e15m)" fill="none"/><g transform="translate(44 40)"><circle r="25" fill="#1c1e24" stroke="#555867"/><g fill="none" stroke="#e9eaee" stroke-width="1.5"><rect x="-10" y="-13" width="20" height="26" rx="2"/><path d="M-5-5H5M-5 0H5M-5 5H2"/></g></g><text x="90" y="37" text-anchor="start" fill="#e9eaee" font-family="system-ui" font-size="12.5">Pending record</text><text x="90" y="57" text-anchor="start" fill="#aab0bc" font-family="system-ui" font-size="10.5">Current version</text><g transform="translate(44 160)"><circle r="25" fill="#1c1e24" stroke