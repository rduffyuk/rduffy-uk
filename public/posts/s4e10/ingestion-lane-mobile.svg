</style><title id="mobile-title">The research loop I wanted</title><desc id="mobile-desc">Six labelled icons connected in order: selected channels, useful signals, transcript, Rootweaver connections, useful summary, and Ryan reading and developing an idea. This depicts intended purpose, not a qualified automated matching system.</desc><defs><pattern id="mobile-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.6" fill="#3b3f4a"/></pattern><marker id="mobile-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="var(--accent,#7d61b5)" stroke-width="1.4" stroke-dasharray="none"/></marker></defs><rect data-flow-background="solid" width="520" height="860" fill="#141414"/><rect data-flow-background="dots" width="520" height="860" fill="url(#mobile-grid)"/><g font-family="system-ui,sans-serif"><text x="30" y="42" fill="var(--text,#292a33)" font-size="23" font-weight="500">The research loop I wanted</text><text x="30" y="68" fill="var(--muted,#555b66)" font-size="14">Outside material / useful context / ideas</text><path data-flow-edge="1-2" d="M170 145 H342" fill="none" stroke="var(--accent,#7d61b5)" stroke-width="1.6" opacity=".8" marker-end="url(#mobile-arrow)"/><path data-flow-edge="2-3" d="M440 145 H500 Q510 145 510 155 V375 Q510 385 500 385 H448" fill="none" stroke="var(--accent,#7d61b5)" stroke-width="1.6" opacity=".8" marker-end="url(#mobile-arrow)"/><path data-flow-edge="3-4" d="M350 385 H178" fill="none" stroke="var(--accent,#7d61b5)" stroke-width="1.6" opacity=".8" marker-end="url(#mobile-arrow)"/><path data-flow-edge="4-5" d="M80 385 H20 Q10 385 10 395 V615 Q10 625 20 625 H72" fill="none" stroke="var(--accent,#7d61b5)" stroke-width="1.6" opacity=".8" marker-end="url(#mobile-arrow)"/><path data-flow-edge="5-6" d="M170 625 H342" fill="none" stroke="var(--accent,#7d61b5)" stroke-width="1.6" opacity=".8" marker-end="url(#mobile-arrow)"/><g data-flow-node="1"><circle cx="125" cy="145" r="40" fill="var(--card,#fffefb)"/><svg x="99" y="119" width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="var(--text,#292a33)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="38" height="28" rx="3"/><path d="M18 43h12m-6-7v7M10 24h7l4-8 6 15 4-7h7"/></svg><text x="125" y="210" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">01</text><text x="125" y="237" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">Follow selected</text><text x="125" y="260" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">channels</text><text x="125" y="290" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">Find new uploads</text></g><g data-flow-node="2"><circle cx="395" cy="145" r="40" fill="var(--card,#fffefb)"/><svg x="369" y="119" width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="var(--text,#292a33)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="21" cy="21" r="13"/><path d="m31 31 10 10M14 17h14m-14 7h9"/></svg><text x="395" y="210" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">02</text><text x="395" y="237" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">Flag useful signals</text><text x="395" y="290" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">Choose videos worth a closer</text><text x="395" y="309" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">look</text></g><g data-flow-node="3"><circle cx="395" cy="385" r="40" fill="var(--card,#fffefb)"/><svg x="369" y="359" width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="var(--text,#292a33)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6h18l7 7v23H15zM32 6v9h8M8 14v29h25M21 23h13m-13 7h9"/></svg><text x="395" y="450" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">03</text><text x="395" y="477" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">Get the transcript</text><text x="395" y="530" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">The difficult acquisition step</text></g><g data-flow-node="4"><circle cx="125" cy="385" r="40" fill="var(--card,#fffefb)"/><svg x="99" y="359" width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="var(--text,#292a33)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="7"/><circle cx="9" cy="10" r="4"/><circle cx="39" cy="10" r="4"/><circle cx="9" cy="38" r="4"/><circle cx="39" cy="38" r="4"/><path d="m12 13 7 6m10 0 7-6M12 35l7-6m10 0 7 6"/></svg><text x="125" y="450" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">04</text><text x="125" y="477" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">Relate it to</text><text x="125" y="500" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">Rootweaver</text><text x="125" y="530" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">Look for relevant connections</text></g><g data-flow-node="5"><circle cx="125" cy="625" r="40" fill="var(--card,#fffefb)"/><svg x="99" y="599" width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="var(--text,#292a33)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M28 29v11H9V7h15l4 5v7M22 7v8h6m-13 8h6m-6 6h5"/><path d="m29 27 4-4a6 6 0 0 1 8 8l-5 5a6 6 0 0 1-8 0m6-6-4 4a6 6 0 0 1-8-8l4-4"/></svg><text x="125" y="690" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">05</text><text x="125" y="717" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">Condense the material</text><text x="125" y="770" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">A useful summary to read</text></g><g data-flow-node="6"><circle cx="395" cy="625" r="40" fill="var(--card,#fffefb)"/><svg x="369" y="599" width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="var(--text,#292a33)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5h10m-8 0v13L9 37a4 4 0 0 0 4 6h22a4 4 0 0 0 4-6L27 18V5M15 28h18"/><circle cx="22" cy="34" r="2"/><path d="M30 38h1"/></svg><text x="395" y="690" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">06</text><text x="395" y="717" text-anchor="middle" fill="var(--text,#292a33)" font-size="19" font-weight="500">Read and develop ideas</text><text x="395" y="770" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">A feature, question or</text><text x="395" y="789" text-anchor="middle" fill="var(--muted,#555b66)" font-size="14">experiment</text></g><text x="30" y="836" fill="var(--muted,#555b66)" font-size="13">Intended purpose · acquisition and analysis were separate.</text></g></svg>