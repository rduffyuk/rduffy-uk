<svg xmlns="http://www.w3.org/2000/svg" class="icon-flow" viewBox="0 0 520 860" role="img" aria-labelledby="mobile-title mobile-desc" style="--text:#e9eaee;--muted:#aab0bc;--accent:#a78bfa;--card:#1c1e24"><style>
