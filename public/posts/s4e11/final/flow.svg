<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img" aria-label="Budget check, reinforce citation metadata, hygiene checks, propose changes, then notify for human review"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b3f4a"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#a78bfa"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e9eaee}.sub{fill:#aab0bc;font-size:12px}.motion{stroke-dasharray:3 7;animation:travel 1.4s linear infinite}@keyframes travel{to{stroke-dashoffset:-20}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style><rect width="100%" height="100%" fill="#141414"/><rect width="100%" height="100%" fill="url(#grid)"/><path d="M129 57h140" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="100" cy="57" r="27" fill="#1c1e24"/><path d="M-10 -2h20M-7 -8h14M-6 5h12M-2 -12v24" transform="translate(100 57)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="100" y="105" text-anchor="middle" font-size="15">Budget</text><text x="100" y="125" text-anchor="middle" class="sub">Review capacity</text><path d="M329 57h140" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="300" cy="57" r="27" fill="#1c1e24"/><path d="M-10 8v-4h5v-6h5v-6h5v-4h5v20z" transform="translate(300 57)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="300" y="105" text-anchor="middle" font-size="15">Reinforce</text><text x="300" y="125" text-anchor="middle" class="sub">Citation metadata</text><path d="M529 57h140" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="500" cy="57" r="27" fill="#1c1e24"/><path d="M-10 -10h14v20h-14zM-5 -4l3 3 6-6M-5 6h8" transform="translate(500 57)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="500" y="105" text-anchor="middle" font-size="15">Hygiene</text><text x="500" y="125" text-anchor="middle" class="sub">Paths and size</text><path d="M729 57h140" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="700" cy="57" r="27" fill="#1c1e24"/><path d="M-8 -11h11l5 5v17h-16zM3 -11v6h5M-4 0h8M-4 5h8" transform="translate(700 57)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="700" y="105" text-anchor="middle" font-size="15">Propose</text><text x="700" y="125" text-anchor="middle" class="sub">No index apply</text><circle cx="900" cy="57" r="27" fill="#1c1e24"/><path d="M-9 6h18l-3-5v-5a6 6 0 0 0-12 0v5zM-2 10h4" transform="translate(900 57)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="900" y="105" text-anchor="middle" font-size="15">Notify</text><text x="900" y="125" text-anchor="middle" class="sub">Ready for review</text></svg>