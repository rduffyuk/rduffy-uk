<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 700" role="img" aria-label="Budget check, reinforce citation metadata, hygiene checks, propose changes, then notify for human review"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3b3f4a"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#a78bfa"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e9eaee}.sub{fill:#aab0bc;font-size:12px}.motion{stroke-dasharray:3 7;animation:travel 1.4s linear infinite}@keyframes travel{to{stroke-dashoffset:-20}}@media(prefers-reduced-motion:reduce){.motion{animation:none}}</style><rect width="100%" height="100%" fill="#141414"/><rect width="100%" height="100%" fill="url(#grid)"/><path d="M170 125v48" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="170" cy="50" r="27" fill="#1c1e24"/><path d="M-10 -2h20M-7 -8h14M-6 5h12M-2 -12v24" transform="translate(170 50)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="170" y="98" text-anchor="middle" font-size="15">Budget</text><text x="170" y="118" text-anchor="middle" class="sub">Review capacity</text><path d="M170 262v48" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="170" cy="187" r="27" fill="#1c1e24"/><path d="M-10 8v-4h5v-6h5v-6h5v-4h5v20z" transform="translate(170 187)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="170" y="235" text-anchor="middle" font-size="15">Reinforce</text><text x="170" y="255" text-anchor="middle" class="sub">Citation metadata</text><path d="M170 399v48" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="170" cy="324" r="27" fill="#1c1e24"/><path d="M-10 -10h14v20h-14zM-5 -4l3 3 6-6M-5 6h8" transform="translate(170 324)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="170" y="372" text-anchor="middle" font-size="15">Hygiene</text><text x="170" y="392" text-anchor="middle" class="sub">Paths and size</text><path d="M170 536v48" stroke="#a78bfa" fill="none" stroke-width="2" marker-end="url(#arrow)" class="motion" data-flow-edge="true"/><circle cx="170" cy="461" r="27" fill="#1c1e24"/><path d="M-8 -11h11l5 5v17h-16zM3 -11v6h5M-4 0h8M-4 5h8" transform="translate(170 461)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="170" y="509" text-anchor="middle" font-size="15">Propose</text><text x="170" y="529" text-anchor="middle" class="sub">No index apply</text><circle cx="170" cy="598" r="27" fill="#1c1e24"/><path d="M-9 6h18l-3-5v-5a6 6 0 0 0-12 0v5zM-2 10h4" transform="translate(170 598)" stroke="#e9eaee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="170" y="646" text-anchor="middle" font-size="15">Notify</text><text x="170" y="666" text-anchor="middle" class="sub">Ready for review</text></svg>