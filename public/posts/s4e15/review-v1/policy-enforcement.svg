<svg class="policy-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="policy-desktop-title policy-desktop-desc">
<title id="policy-desktop-title">From merge-request facts to policy findings and a non-blocking CI job</title>
<desc id="policy-desktop-desc">Git facts become JSON input, four Rego contracts evaluate their own modes, and Conftest produces findings. Off is silent for those contracts, warn produces warnings, enforce can produce denials. The historical job still allowed failure, so a denial did not necessarily block the pipeline. Lines show evaluation direction, not live traffic.</desc>
<defs><pattern id="policy-desktop-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="policy-desktop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs>
<style>.policy-svg{font-family:system-ui,-apple-system,sans-serif}.flow-motion{animation:policy-dots 1.4s linear infinite}@keyframes policy-dots{to{stroke-dashoffset:-20}}.flow-paused .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.flow-motion{animation:none}}</style>
<rect width="900" height="600" rx="12" fill="#141414"/><rect width="900" height="600" fill="url(#policy-desktop-dots)"/>
<g transform="translate(110 65)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-10" cy="-12" r="4"/><circle cx="-10" cy="12" r="4"/><circle cx="12" cy="0" r="4"/><path d="M-10-8v16M-6-12h5q13 0 13 8"/></g></g><text x="110" y="122" fill="#e9eaee" font-size="16" text-anchor="middle" font-weight="650">MR evidence</text><text x="110" y="146" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">Git trailers + diff</text><text x="110" y="167" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">Available risk artifact</text><g transform="translate(335 65)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-12-19H6l9 9v29h-27zM6-19v10h9M-5-2l-5 5 5 5M7-2l5 5-5 5"/></g></g><text x="335" y="122" fill="#e9eaee" font-size="16" text-anchor="middle" font-weight="650">Build JSON input</text><text x="335" y="146" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">Paths, size, provenance</text><text x="335" y="167" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">Co-author signal + modes</text><g transform="translate(560 65)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-21l18 7v13q0 14-18 23Q-18 13-18-1v-13zM-8 0l6 6L10-7"/></g></g><text x="560" y="122" fill="#e9eaee" font-size="16" text-anchor="middle" font-weight="650">Evaluate policies</text><text x="560" y="146" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">Provenance · batch size</text><text x="560" y="167" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">CI integrity · risk routing</text><g transform="translate(785 65)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-19-16h38v27H-5l-11 9v-9h-3zM-10-6h20M-10 2H5"/></g></g><text x="785" y="122" fill="#e9eaee" font-size="16" text-anchor="middle" font-weight="650">Retain findings</text><text x="785" y="146" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">Conftest JSON + artifact</text><text x="785" y="167" fill="#aab0bc" font-size="15" text-anchor="middle" font-weight="500">MR comment attempted</text><path data-flow-edge="" class="flow-motion" d="M146 65H297" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-desktop-arrow)"/><path data-flow-edge="" class="flow-motion" d="M371 65H522" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-desktop-arrow)"/><path data-flow-edge="" class="flow-motion" d="M596 65H747" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-desktop-arrow)"/><text x="450" y="228" fill="#e9eaee" font-size="17" text-anchor="middle" font-weight="650">Mode routing happens inside each of the four contracts</text><rect x="40" y="252" width="250" height="96" rx="10" fill="#1c1e24" stroke="#484052"/><text x="56" y="278" fill="#c4b5fd" font-size="15" text-anchor="start" font-weight="650">OFF</text><text x="56" y="303" fill="#e9eaee" font-size="15" text-anchor="start" font-weight="500">No finding from that contract</text><rect x="325" y="252" width="250" height="96" rx="10" fill="#1c1e24" stroke="#484052"/><text x="341" y="278" fill="#c4b5fd" font-size="15" text-anchor="start" font-weight="650">WARN · delivered default</text><text x="341" y="303" fill="#e9eaee" font-size="15" text-anchor="start" font-weight="500">Violation → warning</text><rect x="610" y="252" width="250" height="96" rx="10" fill="#1c1e24" stroke="#484052"/><text x="626" y="278" fill="#c4b5fd" font-size="15" text-anchor="start" font-weight="650">ENFORCE · code path</text><text x="626" y="303" fill="#e9eaee" font-size="15" text-anchor="start" font-weight="500">Violation → denial*</text><text x="450" y="379" fill="#c4b5fd" font-size="16" text-anchor="middle" font-weight="650">A policy-level denial is not yet a pipeline-level block.</text><path data-flow-edge="" class="flow-motion" d="M785 184H884V421H785V444" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-desktop-arrow)"/><rect x="40" y="446" width="820" height="113" rx="10" fill="#1c1e24" stroke="#75608f"/><g transform="translate(88 502)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 0h12m20 0h12M-10-12h20v24h-20zM-4-5l9 5-9 5z"/></g></g><text x="88" y="559" fill="#e9eaee" font-size="16" text-anchor="middle" font-weight="650"></text><text x="145" y="477" fill="#e9eaee" font-size="17" text-anchor="start" font-weight="650">CI wrapper: allow_failure: true</text><text x="145" y="506" fill="#e9eaee" font-size="15" text-anchor="start" font-weight="500">A denial can fail the job; this job is allowed to fail.</text><text x="145" y="534" fill="#c4b5fd" font-size="15" text-anchor="start" font-weight="500">The pipeline may remain green. Enforcement graduation is separate.</text></svg>