<svg class="policy-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1120" role="img" aria-labelledby="policy-mobile-title policy-mobile-desc">
<title id="policy-mobile-title">From merge-request facts to policy findings and a non-blocking CI job</title>
<desc id="policy-mobile-desc">Git facts become JSON input, four Rego contracts evaluate their own modes, and Conftest produces findings. Off is silent for those contracts, warn produces warnings, enforce can produce denials. The historical job still allowed failure, so a denial did not necessarily block the pipeline. Lines show evaluation direction, not live traffic.</desc>
<defs><pattern id="policy-mobile-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="policy-mobile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs>
<style>.policy-svg{font-family:system-ui,-apple-system,sans-serif}.flow-motion{animation:policy-dots 1.4s linear infinite}@keyframes policy-dots{to{stroke-dashoffset:-20}}.flow-paused .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.flow-motion{animation:none}}</style>
<rect width="360" height="1120" rx="12" fill="#141414"/><rect width="360" height="1120" fill="url(#policy-mobile-dots)"/>
<g transform="translate(49 64)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-10" cy="-12" r="4"/><circle cx="-10" cy="12" r="4"/><circle cx="12" cy="0" r="4"/><path d="M-10-8v16M-6-12h5q13 0 13 8"/></g></g><text x="103" y="52" fill="#e9eaee" font-size="16" text-anchor="start" font-weight="650">MR evidence</text><text x="103" y="76" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">Git trailers + diff</text><text x="103" y="97" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">Available risk artifact</text><g transform="translate(49 194)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-12-19H6l9 9v29h-27zM6-19v10h9M-5-2l-5 5 5 5M7-2l5 5-5 5"/></g></g><text x="103" y="182" fill="#e9eaee" font-size="16" text-anchor="start" font-weight="650">Build JSON input</text><text x="103" y="206" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">Paths, size, provenance</text><text x="103" y="227" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">Co-author signal + modes</text><g transform="translate(49 324)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-21l18 7v13q0 14-18 23Q-18 13-18-1v-13zM-8 0l6 6L10-7"/></g></g><text x="103" y="312" fill="#e9eaee" font-size="16" text-anchor="start" font-weight="650">Evaluate policies</text><text x="103" y="336" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">Provenance · batch size</text><text x="103" y="357" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">CI integrity · risk routing</text><g transform="translate(49 454)"><circle r="32" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-19-16h38v27H-5l-11 9v-9h-3zM-10-6h20M-10 2H5"/></g></g><text x="103" y="442" fill="#e9eaee" font-size="16" text-anchor="start" font-weight="650">Retain findings</text><text x="103" y="466" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">Conftest JSON + artifact</text><text x="103" y="487" fill="#aab0bc" font-size="13" text-anchor="start" font-weight="500">MR comment attempted</text><path data-flow-edge="" class="flow-motion" d="M49 100V157" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-mobile-arrow)"/><path data-flow-edge="" class="flow-motion" d="M49 230V287" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-mobile-arrow)"/><path data-flow-edge="" class="flow-motion" d="M49 360V417" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-mobile-arrow)"/><text x="80" y="554" fill="#e9eaee" font-size="14" text-anchor="start" font-weight="650">Each contract has its own mode</text><rect x="80" y="574" width="260" height="96" rx="10" fill="#1c1e24" stroke="#484052"/><text x="96" y="600" fill="#c4b5fd" font-size="15" text-anchor="start" font-weight="650">OFF</text><text x="96" y="625" fill="#e9eaee" font-size="15" text-anchor="start" font-weight="500">No finding from that contract</text><rect x="80" y="684" width="260" height="96" rx="10" fill="#1c1e24" stroke="#484052"/><text x="96" y="710" fill="#c4b5fd" font-size="15" text-anchor="start" font-weight="650">WARN · delivered default</text><text x="96" y="735" fill="#e9eaee" font-size="15" text-anchor="start" font-weight="500">Violation → warning</text><rect x="80" y="794" width="260" height="96" rx="10" fill="#1c1e24" stroke="#484052"/><text x="96" y="820" fill="#c4b5fd" font-size="15" text-anchor="start" font-weight="650">ENFORCE · code path</text><text x="96" y="845" fill="#e9eaee" font-size="15" text-anchor="start" font-weight="500">Violation → denial*</text><path data-flow-edge="" class="flow-motion" d="M49 490V920H80" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#policy-mobile-arrow)"/><rect x="80" y="922" width="260" height="170" rx="10" fill="#1c1e24" stroke="#75608f"/><text x="96" y="951" fill="#e9eaee" font-size="14" text-anchor="start" font-weight="650">CI wrapper is a second decision</text><text x="96" y="980" fill="#c4b5fd" font-size="13" text-anchor="start" font-weight="500">allow_failure: true</text><text x="96" y="1003" fill="#e9eaee" font-size="13" text-anchor="start" font-weight="500">A denial can fail the job.</text><text x="96" y="1026" fill="#e9eaee" font-size="13" text-anchor="start" font-weight="500">This job is allowed to fail.</text><text x="96" y="1049" fill="#e9eaee" font-size="13" text-anchor="start" font-weight="500">Pipeline may remain green.</text></svg>