<svg xmlns="http://www.w3.org/2000/svg" class="publish-svg" viewBox="0 0 360 640" role="img" aria-labelledby="s5e01-m-title s5e01-m-desc"><title id="s5e01-m-title">Job health and document outcomes are separate</title><desc id="s5e01-m-desc">Simplified dependency map. Graphiti can make interleaved extraction and embedding calls; this diagram is not an exact call-order trace. Per-item failure can coexist with process exit zero. Arrows show conceptual dependencies, not completed processing.</desc><defs><pattern id="s5e01-m-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="s5e01-m-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs><style>.publish-svg{font-family:system-ui,sans-serif}.publish-svg .flow-motion{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:3 7;animation:flowdash 1.4s linear infinite}@keyframes flowdash{to{stroke-dashoffset:-20}}.flow-paused .publish-svg .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.publish-svg .flow-motion{animation:none}}</style><rect width="360" height="640" rx="12" fill="#141414"/><rect width="360" height="640" rx="12" fill="url(#s5e01-m-grid)"/><path class="flow-motion" data-flow-edge="" d="M50 90V110" marker-end="url(#s5e01-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M50 186V206" marker-end="url(#s5e01-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M81 148H88V340H82" marker-end="url(#s5e01-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M81 244H88V436H82" marker-end="url(#s5e01-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M50 378V398" marker-end="url(#s5e01-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M50 474V494" marker-end="url(#s5e01-m-arrow)"/><g transform="translate(50,52)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-16" width="24" height="32" rx="2"/><path d="M-6-7h12M-6 0h12M-6 7h9"/></g></g><text x="103" y="47" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Documents</text><text x="103" y="70" text-anchor="start" font-size="14" fill="#aab0bc">Selected corpus</text><g transform="translate(50,148)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 10v-5c-14-12-3-25 8-23 13 0 20 13 8 23v5zM-7 15H7M-5 19H5"/></g></g><text x="103" y="143" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Graphiti</text><text x="103" y="166" text-anchor="start" font-size="14" fill="#aab0bc">Per-item attempt</text><g transform="translate(50,244)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-16-15v30h33M-9 8V0M0 8v-17M9 8v-12"/></g></g><text x="103" y="239" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Extraction</text><text x="103" y="262" text-anchor="start" font-size="14" fill="#aab0bc">Valid structure</text><g transform="translate(50,340)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-16-15v30h33M-9 8V0M0 8v-17M9 8v-12"/></g></g><text x="103" y="335" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Embeddings</text><text x="103" y="358" text-anchor="start" font-size="14" fill="#aab0bc">Batch / timeout</text><g transform="translate(50,436)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-16" width="24" height="32" rx="2"/><path d="M-6-7h12M-6 0h12M-6 7h9"/></g></g><text x="103" y="431" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Graph write</text><text x="103" y="454" text-anchor="start" font-size="14" fill="#aab0bc">Inspect data</text><g transform="translate(50,532)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="103" y="527" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Marker</text><text x="103" y="550" text-anchor="start" font-size="14" fill="#aab0bc">Only after success</text><text x="180.0" y="620" text-anchor="middle" font-size="13" fill="#aab0bc">Conceptual path; dots are not live traffic.</text></svg>