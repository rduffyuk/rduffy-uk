<svg xmlns="http://www.w3.org/2000/svg" class="publish-svg" viewBox="0 0 360 640" role="img" aria-labelledby="pub-m-title pub-m-desc"><title id="pub-m-title">Historical gate demonstrator: claims to recorded metrics</title><desc id="pub-m-desc">Claims pass through gate one, deterministic voice and, when eligible, gate two. The resulting decision is recorded in metrics. This inspected emitter does not establish a website release hold. Dotted connectors show direction, not live activity.</desc><defs><pattern id="pub-m-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="pub-m-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs><style>.publish-svg{font-family:system-ui,sans-serif}.publish-svg .flow-motion{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:3 7;animation:publish-dash 1.4s linear infinite}@keyframes publish-dash{to{stroke-dashoffset:-20}}.flow-paused .publish-svg .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.publish-svg .flow-motion{animation:none}}</style><rect width="360" height="640" rx="12" fill="#141414"/><rect width="360" height="640" rx="12" fill="url(#pub-m-grid)"/><path data-flow-edge="" class="flow-motion" d="M50 90V110" marker-end="url(#pub-m-arrow)"/><path data-flow-edge="" class="flow-motion" d="M50 186V206" marker-end="url(#pub-m-arrow)"/><path data-flow-edge="" class="flow-motion" d="M50 282V302" marker-end="url(#pub-m-arrow)"/><path data-flow-edge="" class="flow-motion" d="M50 378V398" marker-end="url(#pub-m-arrow)"/><path data-flow-edge="" class="flow-motion" d="M50 474V494" marker-end="url(#pub-m-arrow)"/><g transform="translate(50,52)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-16" width="24" height="32" rx="2"/><path d="M-6-7h12M-6 0h12M-6 7h9"/></g></g><text x="103" y="47" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Claims</text><text x="103" y="70" text-anchor="start" font-size="14" fill="#aab0bc">Curated corpus</text><g transform="translate(50,148)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="103" y="143" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Gate one</text><text x="103" y="166" text-anchor="start" font-size="14" fill="#aab0bc">Before wording</text><g transform="translate(50,244)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-12 13l4-12L7-14l7 7L-1 8zM-8 1l7 7M4-11l7 7"/></g></g><text x="103" y="239" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Voice</text><text x="103" y="262" text-anchor="start" font-size="14" fill="#aab0bc">Deterministic</text><g transform="translate(50,340)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="103" y="335" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Gate two</text><text x="103" y="358" text-anchor="start" font-size="14" fill="#aab0bc">When eligible</text><g transform="translate(50,436)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-12-16h24v34l-6-4-6 4-6-4-6 4zM-6-7h12M-6 0h12M-6 7h7"/></g></g><text x="103" y="431" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Decision</text><text x="103" y="454" text-anchor="start" font-size="14" fill="#aab0bc">Clear or blocked</text><g transform="translate(50,532)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-16-15v30h33M-9 8V0M0 8v-17M9 8v-12"/></g></g><text x="103" y="527" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Metrics</text><text x="103" y="550" text-anchor="start" font-size="14" fill="#aab0bc">Record result</text><text x="180.0" y="603" text-anchor="middle" font-size="13" fill="#aab0bc">Records a decision; does not prove</text><text x="180.0" y="623" text-anchor="middle" font-size="13" fill="#aab0bc">a website release hold.</text></svg>