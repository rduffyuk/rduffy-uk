<svg xmlns="http://www.w3.org/2000/svg" class="publish-svg" viewBox="0 0 900 485" role="img" aria-labelledby="s4e18-v2-d-title s4e18-v2-d-desc"><title id="s4e18-v2-d-title">One alert, three different action paths</title><desc id="s4e18-v2-d-desc">Inspected historical relay mechanism, simplified. The three controls are alternatives. Ack and Silence require retained context; only Silence adds the owner check. Triage initially returned a fallback. Dots show direction, not live activity.</desc><defs><pattern id="s4e18-v2-d-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="s4e18-v2-d-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs><style>.publish-svg{font-family:system-ui,sans-serif}.publish-svg .flow-motion{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:3 7;animation:flowdash 1.4s linear infinite}@keyframes flowdash{to{stroke-dashoffset:-20}}.flow-paused .publish-svg .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.publish-svg .flow-motion{animation:none}}</style><rect width="900" height="485" rx="12" fill="#141414"/><rect width="900" height="485" rx="12" fill="url(#s4e18-v2-d-grid)"/><path class="flow-motion" data-flow-edge="" d="M147 50H413" marker-end="url(#s4e18-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M487 50H753" marker-end="url(#s4e18-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M827 50H870V160H450V181" marker-end="url(#s4e18-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M487 215H550V316H150V356" marker-end="url(#s4e18-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M487 215H550V316H450V356" marker-end="url(#s4e18-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M487 215H550V316H750V356" marker-end="url(#s4e18-v2-d-arrow)"/><g transform="translate(110,50)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 10h28l-4-7V-4c0-17-20-17-20 0v7zM-4 15q4 8 8 0"/></g></g><text x="110" y="101" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Alertmanager</text><text x="110" y="124" text-anchor="middle" font-size="13" fill="#aab0bc">Severity route</text><g transform="translate(450,50)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-16" width="24" height="32" rx="2"/><path d="M-6-7h12M-6 0h12M-6 7h9"/></g></g><text x="450" y="101" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Relay</text><text x="450" y="124" text-anchor="middle" font-size="13" fill="#aab0bc">Post, then store</text><g transform="translate(790,50)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cy="-9" r="7"/><path d="M-16 17v-6c0-8 32-8 32 0v6"/></g></g><text x="790" y="101" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Discord message</text><text x="790" y="124" text-anchor="middle" font-size="13" fill="#aab0bc">Human selects control</text><g transform="translate(450,215)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="450" y="266" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Verify request</text><text x="450" y="289" text-anchor="middle" font-size="13" fill="#aab0bc">Signed interaction</text><g transform="translate(150,390)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-18-14h36v24H0l-11 8v-8h-7zM-10-5h20M-10 2h12"/></g></g><text x="150" y="441" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Ack</text><text x="150" y="464" text-anchor="middle" font-size="13" fill="#aab0bc">Context → message update</text><g transform="translate(450,390)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-7" cy="-6" r="9"/><path d="M0 1l15 15M7 8l4-4M11 12l4-4"/></g></g><text x="450" y="441" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Silence</text><text x="450" y="464" text-anchor="middle" font-size="13" fill="#aab0bc">Context + owner → bounded API call</text><g transform="translate(750,390)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 10v-5c-14-12-3-25 8-23 13 0 20 13 8 23v5zM-7 15H7M-5 19H5"/></g></g><text x="750" y="441" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Triage</text><text x="750" y="464" text-anchor="middle" font-size="13" fill="#aab0bc">Defer → client or fallback</text></svg>