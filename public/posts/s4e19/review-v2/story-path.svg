<svg xmlns="http://www.w3.org/2000/svg" class="publish-svg" viewBox="0 0 920 390" role="img" aria-labelledby="s4e19-v2-d-title s4e19-v2-d-desc"><title id="s4e19-v2-d-title">One engine, two publication paths</title><desc id="s4e19-v2-d-desc">Two callers reach the same engine code, then cross separate Kafka publication boundaries. Model success and rule-based fallback require the same output policy. This diagram covers named Kafka fields, not every HTTP response or persistence path. Dots show direction, not live activity; no remediation executor is shown.</desc><defs><pattern id="s4e19-v2-d-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="s4e19-v2-d-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs><style>.publish-svg{font-family:system-ui,sans-serif}.publish-svg .flow-motion{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:3 7;animation:flowdash 1.4s linear infinite}@keyframes flowdash{to{stroke-dashoffset:-20}}.flow-paused .publish-svg .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.publish-svg .flow-motion{animation:none}}</style><rect width="920" height="390" rx="12" fill="#141414"/><rect width="920" height="390" rx="12" fill="url(#s4e19-v2-d-grid)"/><path class="flow-motion" data-flow-edge="" d="M142 55H298" marker-end="url(#s4e19-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M372 55H528" marker-end="url(#s4e19-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M142 250H298" marker-end="url(#s4e19-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M372 250H528" marker-end="url(#s4e19-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M602 55H688V150H768" marker-end="url(#s4e19-v2-d-arrow)"/><path class="flow-motion" data-flow-edge="" d="M602 250H688V150H768" marker-end="ur