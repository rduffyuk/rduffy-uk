 fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 10v-5c-14-12-3-25 8-23 13 0 20 13 8 23v5zM-7 15H7M-5 19H5"/></g></g><text x="335" y="301" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Triage engine</text><text x="335" y="324" text-anchor="middle" font-size="13" fill="#aab0bc">Model or fallback</text><g transform="translate(565,250)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="565" y="301" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">HTTP guard</text><text x="565" y="324" text-anchor="middle" font-size="13" fill="#aab0bc">Redacted result copy</text><g transform="translate(805,150)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-18-14h36v24H0l-11 8v-8h-7zM-10-5h20M-10 2h12"/></g></g><text x="805" y="201" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Kafka publisher</text><text x="805" y="224" text-anchor="middle" font-size="13" fill="#aab0bc">Delivery still needs a check</text></svg>