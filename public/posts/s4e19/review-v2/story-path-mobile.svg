<svg xmlns="http://www.w3.org/2000/svg" class="publish-svg" viewBox="0 0 360 935" role="img" aria-labelledby="s4e19-v2-m-title s4e19-v2-m-desc"><title id="s4e19-v2-m-title">One engine, two publication paths</title><desc id="s4e19-v2-m-desc">Two callers reach the same engine code, then cross separate Kafka publication boundaries. Model success and rule-based fallback require the same output policy. This diagram covers named Kafka fields, not every HTTP response or persistence path. Dots show direction, not live activity; no remediation executor is shown.</desc><defs><pattern id="s4e19-v2-m-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="s4e19-v2-m-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs><style>.publish-svg{font-family:system-ui,sans-serif}.publish-svg .flow-motion{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:3 7;animation:flowdash 1.4s linear infinite}@keyframes flowdash{to{stroke-dashoffset:-20}}.flow-paused .publish-svg .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.publish-svg .flow-motion{animation:none}}</style><rect width="360" height="935" rx="12" fill="#141414"/><rect width="360" height="935" rx="12" fill="url(#s4e19-v2-m-grid)"/><path class="flow-motion" data-flow-edge="" d="M52 86V126" marker-end="url(#s4e19-v2-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M52 194V234" marker-end="url(#s4e19-v2-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M52 464V504" marker-end="url(#s4e19-v2-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M52 572V612" marker-end="url(#s4e19-v2-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M52 302V338H16V830H165" marker-end="url(#s4e19-v2-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M52 680V730H92V830H165" marker-end="url(#s4e19-v2-m-arrow)"/><g transform="translate(52,52)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 10h28l-4-7V-4c0-17-20-17-20 0v7zM-4 15q4 8 8 0"/></g></g><text x="103" y="47" text-anchor="start" font-size="17" font-weight="650" fill="#e9eaee">Kafka alert</text><text x="103" y="70" text-anchor="start" font-size="13" fill="#aab0bc">Consumer caller</text><g transform="translate(52,160)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 10v-5c-14-12-3-25 8-23 13 0 20 13 8 23v5zM-7 15H7M-5 19H5"/></g></g><text x="103" y="155" text-anchor="start" font-size="17" font-weight="650" fill="#e9eaee">Triage engine</text><text x="103" y="178" text-anchor="start" font-size="13" fill="#aab0bc">Model or fallback</text><g transform="translate(52,268)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="103" y="263" text-anchor="start" font-size="17" font-weight="650" fill="#e9eaee">Consumer guard</text><text x="103" y="286" text-anchor="start" font-size="13" fill="#aab0bc">Protect outgoing fields</text><g transform="translate(52,430)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-16" width="24" height="32" rx="2"/><path d="M-6-7h12M-6 0h12M-6 7h9"/></g></g><text x="103" y="425" text-anchor="start" font-size="17" font-weight="650" fill="#e9eaee">HTTP request</text><text x="103" y="448" text-anchor="start" font-size="13" fill="#aab0bc">Alternate caller</text><g transform="translate(52,538)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-8 10v-5c-14-12-3-25 8-23 13 0 20 13 8 23v5zM-7 15H7M-5 19H5"/></g></g><text x="103" y="533" text-anchor="start" font-size="17" font-weight="650" fill="#e9eaee">Triage engine</text><text x="103" y="556" text-anchor="start" font-size="13" fill="#aab0bc">Model or fallback</text><g transform="translate(52,646)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="103" y="641" text-anchor="start" font-size="17" font-weight="650" fill="#e9eaee">HTTP guard</text><text x="103" y="664" text-anchor="start" font-size="13" fill="#aab0bc">Redacted result copy</text><g transform="translate(200,830)"><circle r="29" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-18-14h36v24H0l-11 8v-8h-7zM-10-5h20M-10 2h12"/></g></g><text x="200" y="881" text-anchor="middle" font-size="17" font-weight="650" fill="#e9eaee">Kafka publisher</text><text x="200" y="904" text-anchor="middle" font-size="13" fill="#aab0bc">Delivery still needs a check</text></svg>