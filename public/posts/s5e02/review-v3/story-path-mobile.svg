<svg xmlns="http://www.w3.org/2000/svg" class="publish-svg" viewBox="0 0 360 640" role="img" aria-labelledby="s5e02-m-title s5e02-m-desc"><title id="s5e02-m-title">Discovery when there is no explicit override</title><desc id="s5e02-m-desc">Fallback discovery path from historical llm_discovery.py. An explicit caller override bypasses this flow. Empty/unreachable/no qualifying models raise an error; order and name filtering are deployment assumptions, not proof of model capability.</desc><defs><pattern id="s5e02-m-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="s5e02-m-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs><style>.publish-svg{font-family:system-ui,sans-serif}.publish-svg .flow-motion{fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-dasharray:3 7;animation:flowdash 1.4s linear infinite}@keyframes flowdash{to{stroke-dashoffset:-20}}.flow-paused .publish-svg .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.publish-svg .flow-motion{animation:none}}</style><rect width="360" height="640" rx="12" fill="#141414"/><rect width="360" height="640" rx="12" fill="url(#s5e02-m-grid)"/><path class="flow-motion" data-flow-edge="" d="M50 90V110" marker-end="url(#s5e02-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M50 186V206" marker-end="url(#s5e02-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M50 282V302" marker-end="url(#s5e02-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M50 378V398" marker-end="url(#s5e02-m-arrow)"/><path class="flow-motion" data-flow-edge="" d="M50 474V494" marker-end="url(#s5e02-m-arrow)"/><g transform="translate(50,52)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cy="-9" r="7"/><path d="M-16 17v-6c0-8 32-8 32 0v6"/></g></g><text x="103" y="47" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Caller</text><text x="103" y="70" text-anchor="start" font-size="14" fill="#aab0bc">No explicit pin</text><g transform="translate(50,148)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-16" width="24" height="32" rx="2"/><path d="M-6-7h12M-6 0h12M-6 7h9"/></g></g><text x="103" y="143" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Endpoint</text><text x="103" y="166" text-anchor="start" font-size="14" fill="#aab0bc">Generation models</text><g transform="translate(50,244)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-16-15v30h33M-9 8V0M0 8v-17M9 8v-12"/></g></g><text x="103" y="239" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Entries</text><text x="103" y="262" text-anchor="start" font-size="14" fill="#aab0bc">Inspect IDs</text><g transform="translate(50,340)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17l15 6v12c-1 9-8 14-15 17-7-3-14-8-15-17v-12z"/><path d="M-6 0l4 5 9-11"/></g></g><text x="103" y="335" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Filter</text><text x="103" y="358" text-anchor="start" font-size="14" fill="#aab0bc">Skip embed names</text><g transform="translate(50,436)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="-7" cy="-6" r="9"/><path d="M0 1l15 15M7 8l4-4M11 12l4-4"/></g></g><text x="103" y="431" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Selection</text><text x="103" y="454" text-anchor="start" font-size="14" fill="#aab0bc">Cache / return</text><g transform="translate(50,532)"><circle r="30" fill="#1c1e24" stroke="#4b435e"/><g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M-18-14h36v24H0l-11 8v-8h-7zM-10-5h20M-10 2h12"/></g></g><text x="103" y="527" text-anchor="start" font-size="18" font-weight="650" fill="#e9eaee">Request</text><text x="103" y="550" text-anchor="start" font-size="14" fill="#aab0bc">Use served name</text><text x="180.0" y="620" text-anchor="middle" font-size="13" fill="#aab0bc">Conceptual path; dots are not live traffic.</text></svg>