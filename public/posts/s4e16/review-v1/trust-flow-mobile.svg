<svg xmlns="http://www.w3.org/2000/svg" class="trust-svg" viewBox="0 0 360 1010" role="img" aria-labelledby="trust-mobile-title trust-mobile-desc"><title id="trust-mobile-title">Historical audit library flow: context, support, grounding and two gates</title><desc id="trust-mobile-desc">Capture records claims and context. The assessor supplies source support. The engine combines support with a recorded reliance marker. Gate one checks claim spans, a deterministic renderer records the final text map, then gate two checks the final artifact. Audit events are recorded in Postgres; the graph is a derived view. This is library architecture, not observed production execution.</desc><defs><pattern id="trust-mobile-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#3b3f4a"/></pattern><marker id="trust-mobile-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#a78bfa" stroke-width="1.5"/></marker></defs><style>.trust-svg{font-family:system-ui,sans-serif}.flow-motion{animation:trust-dots 1.4s linear infinite}@keyframes trust-dots{to{stroke-dashoffset:-20}}.flow-paused .flow-motion{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.flow-motion{animation:none}}</style><rect width="360" height="1010" rx="12" fill="#141414"/><rect width="360" height="1010" fill="url(#trust-mobile-dots)"/><g transform="translate(50 65)"><circle r="31" fill="#1c1e24" stroke="#4b435e"/><path d="M-13-18H7l8 8v28h-28zM7-18v9h8M-6-2h14M-6 6h14" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g><text x="103" y="60" fill="#e9eaee" font-size="17" font-weight="650" text-anchor="start">Capture</text><text x="103" y="85" fill="#aab0bc" font-size="14" text-anchor="start">Claim + context marker</text><path data-flow-edge="" class="flow-motion" d="M50 103V169" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#trust-mobile-arrow)"/><g transform="translate(50 207)"><circle r="31" fill="#1c1e24" stroke="#4b435e"/><path d="M-18-14h36v24h-13l-8 9v-9h-15zM-10-5h20M-10 2h12" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g><text x="103" y="202" fill="#e9eaee" font-size="17" font-weight="650" text-anchor="start">Assess support</text><text x="103" y="227" fill="#aab0bc" font-size="14" text-anchor="start">Source text + NLI / judge</text><path data-flow-edge="" class="flow-motion" d="M50 245V311" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#trust-mobile-arrow)"/><g transform="translate(50 349)"><circle r="31" fill="#1c1e24" stroke="#4b435e"/><path d="M-19-12h12l14 24h12M-19 12h12l14-24h12" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g><text x="103" y="344" fill="#e9eaee" font-size="17" font-weight="650" text-anchor="start">Combine</text><text x="103" y="369" fill="#aab0bc" font-size="14" text-anchor="start">Support × reliance</text><path data-flow-edge="" class="flow-motion" d="M50 387V453" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#trust-mobile-arrow)"/><g transform="translate(50 491)"><circle r="31" fill="#1c1e24" stroke="#4b435e"/><path d="M0-22l18 8v12q0 14-18 24Q-18 12-18-2v-12zM-8 0l6 6L10-7" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g><text x="103" y="486" fill="#e9eaee" font-size="17" font-weight="650" text-anchor="start">Gate 1</text><text x="103" y="511" fill="#aab0bc" font-size="14" text-anchor="start">Classified claim spans</text><path data-flow-edge="" class="flow-motion" d="M50 529V595" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#trust-mobile-arrow)"/><g transform="translate(50 633)"><circle r="31" fill="#1c1e24" stroke="#4b435e"/><path d="M-18-17h36v34h-36zM-10-8h20M-10 0h14M-10 8h18" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g><text x="103" y="628" fill="#e9eaee" font-size="17" font-weight="650" text-anchor="start">Render</text><text x="103" y="653" fill="#aab0bc" font-size="14" text-anchor="start">Text + exact span map</text><path data-flow-edge="" class="flow-motion" d="M50 671V737" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="3 7" marker-end="url(#trust-mobile-arrow)"/><g transform="translate(50 775)"><circle r="31" fill="#1c1e24" stroke="#4b435e"/><path d="M0-22l18 8v12q0 14-18 24Q-18 12-18-2v-12zM-8 0l6 6L10-7" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g><text x="103" y="770" fill="#e9eaee" font-size="17" font-weight="650" text-anchor="start">Gate 2</text><text x="103" y="795" fill="#aab0bc" font-size="14" text-anchor="start">The final rendered text</text><text x="180.0" y="902" text-anchor="middle" fill="#c4b5fd" font-size="13">Postgres log → rebuilt graph</text><text x="180.0" y="938" text-anchor="middle" fill="#c4b5fd" font-size="13">Library architecture, not deployment proof</text><text x="180.0" y="972" text-anchor="middle" fill="#c4b5fd" font-size="13">Dotted lines show direction, not live traffic</text></svg>