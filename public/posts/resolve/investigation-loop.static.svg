<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc"><title id="title">Give the model tools. Keep the method visible.</title><desc id="desc">Nemotron Ultra proposes a check ID. The host validates it and executes fixed scoped tooling. Complete output is retained, a bounded projection returns to the model, and the human reviews the method and remaining uncertainty. This is the historical lab implementation; the standalone app replays its records. Animation illustrates direction only, not live traffic or measured timing.</desc><defs><marker id="action" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#7146e8"/></marker><marker id="result" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64727a"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#ddd9d0"/></pattern><style></style></defs><rect width="1280" height="820" fill="#f7f6f2"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="36" fill="#7146e8" font-size="12" font-weight="700" text-anchor="start">ROOTWEAVER RESOLVE / ATLAS / INVESTIGATION DESIGN</text><text x="44" y="83" fill="#26313a" font-size="32" font-weight="600" text-anchor="start">Give the model tools. Keep the method visible.</text><text x="44" y="117" fill="#53606a" font-size="17" font-weight="400" text-anchor="start">The retained lab loop: an available check is chosen, executed, recorded and reassessed.</text><rect x="40" y="150" width="1200" height="550" fill="url(#dots)"/><rect x="44" y="158" width="1192" height="514" rx="14" fill="#fff" fill-opacity=".45" stroke="#d9d7ce" stroke-dasharray="none"/><text x="62" y="185" fill="#53606a" font-size="14" font-weight="600" text-anchor="start">RETAINED LAB EXECUTION · not a new collection from the standalone viewer</text><path id="edge-0" d="M374,290 L484,290" fill="none" stroke="#7146e8" stroke-width="1.8" marker-end="url(#action)"/><rect x="379.0" y="250" width="100" height="25" rx="6" fill="#f7f6f2"/><text x="429" y="267" fill="#7146e8" font-size="15" font-weight="400" text-anchor="middle">check ID</text><path id="edge-1" d="M794,290 L904,290" fill="none" stroke="#7146e8" stroke-width="1.8" marker-end="url(#action)"/><rect x="799.0" y="250" width="100" height="25" rx="6" fill="#f7f6f2"/><text x="849" y="267" fill="#7146e8" font-size="15" font-weight="400" text-anchor="middle">fixed call</text><path id="edge-2" d="M1060,362 L1060,478" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="1089.0" y="409" width="102" height="25" rx="6" fill="#f7f6f2"/><text x="1140" y="426" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">full output</text><path id="edge-3" d="M904,550 L794,550" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="804.0" y="511" width="90" height="25" rx="6" fill="#f7f6f2"/><text x="849" y="528" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">project</text><path id="edge-4" d="M640,478 L640,420 L310,420 L310,362" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="359.5" y="390" width="245" height="25" rx="6" fill="#f7f6f2"/><text x="482" y="407" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">new evidence → reassess</text><path id="edge-5" d="M160,362 L160,478" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="93.0" y="428" width="162" height="25" rx="6" fill="#f7f6f2"/><text x="174" y="445" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">public assessment</text><path id="edge-6" d="M1060,622 L1060,650 L220,650 L220,622" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="494.0" y="629" width="302" height="25" rx="6" fill="#f7f6f2"/><text x="645" y="646" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">inspect complete captured records</text><g data-node="model"><rect x="64" y="218" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="98" cy="253" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(98,253) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-15,-6 L0,-16 L15,-6 V10 L0,19 L-15,10 Z M-15,-6 L0,3 L15,-6 M0,3 V19"/></g><text x="130" y="249" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Nemotron Ultra</text><text x="130" y="272" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Nebius Token Factory</text><text x="82" y="306" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Competing hypotheses</text><text x="82" y="329" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Chooses an available check ID</text></g><g data-node="host"><rect x="484" y="218" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="518" cy="253" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(518,253) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-18 L15,-11 V1 Q15,12 0,20 Q-15,12 -15,1 V-11 Z M-7,0 L-1,6 L8,-5"/></g><text x="550" y="249" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Trusted host</text><text x="550" y="272" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Scope and execution authority</text><text x="502" y="306" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Validates choice and citations</text><text x="502" y="329" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Binds target, arguments and limits</text></g><g data-node="tools"><rect x="904" y="218" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="938" cy="253" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(938,253) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-17" y="-12" width="34" height="24" rx="3"/><path d="M-11,-5 L-5,0 L-11,5 M0,6 H10"/></g><text x="970" y="249" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Debugging tools</text><text x="970" y="272" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Read-only checks / bounded capture</text><text x="922" y="306" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">kubectl logs · resources</text><text x="922" y="329" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Observe + dumpcap / TShark</text></g><g data-node="record"><rect x="904" y="478" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="938" cy="513" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(938,513) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-10" rx="16" ry="6"/><path d="M-16,-10 V11 C-16,19 16,19 16,11 V-10 M-16,0 C-16,8 16,8 16,0"/></g><text x="970" y="509" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Retained evidence</text><text x="970" y="532" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Complete captured output</text><text x="922" y="566" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Sources, timestamps and receipts</text><text x="922" y="589" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Logs, packets and model exchanges</text></g><g data-node="input"><rect x="484" y="478" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="518" cy="513" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(518,513) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle r="5"/><path d="M-4,-4 L-12,-12 M4,-4 L12,-12 M0,5 V15"/><circle cx="-14" cy="-14" r="4"/><circle cx="14" cy="-14" r="4"/><circle cy="18" r="4"/></g><text x="550" y="509" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Model-facing evidence</text><text x="550" y="532" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">A disclosed, bounded projection</text><text x="502" y="566" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Only evidence acquired so far</text><text x="502" y="589" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Capture and input limits stay visible</text></g><g data-node="human"><rect x="64" y="478" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="98" cy="513" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(98,513) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-9" r="7"/><path d="M-15,17 V12 C-15,-1 15,-1 15,12 V17"/></g><text x="130" y="509" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Human SRE</text><text x="130" y="532" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Interpretation and operational judgment</text><text x="82" y="566" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Inspect commands and source data</text><text x="82" y="589" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Review uncertainty and next steps</text></g><text x="64" y="703" fill="#53606a" font-size="15" font-weight="400" text-anchor="start">Model statements remain advisory. Separate selector rules establish only the narrow finding in the earlier case console.</text><path d="M44,720 H1236" stroke="#d9d7ce"/><text x="44" y="750" fill="#53606a" font-size="14" font-weight="400" text-anchor="start">Solid arrows: action / request   ·   Dotted arrows: returned evidence / result</text><text x="44" y="780" fill="#53606a" font-size="14" font-weight="400" text-anchor="start">A bounded prototype · Model-selected checks are not arbitrary shell access · Animation is illustrative, not live traffic.</text></g></svg>
